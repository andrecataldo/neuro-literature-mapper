- id: v4-3f-audit-12-get-a-generative-eeg-transformer-for-continuous-context
  title: 'GET: A Generative EEG Transformer for Continuous Context-Based Neural Signals'
  abstract: Generating continuous electroencephalography (EEG) signals through advanced artificial neural
    networks presents a novel opportunity to enhance brain-computer interface (BCI) technology. This capability
    has the potential to significantly enhance applications ranging from simulating dynamic brain activity
    and data augmentation to improving real-time epilepsy detection and BCI inference. By harnessing generative
    transformer neural networks, specifically designed for EEG signal generation, we can revolutionize
    the interpretation and interaction with neural data. Generative AI has demonstrated significant success
    across various domains, from natural language processing (NLP) and computer vision to content creation
    in visual arts and music. It distinguishes itself by using large-scale datasets to construct context
    windows during pre-training, a technique that has proven particularly effective in NLP, where models
    are fine-tuned for specific downstream tasks after extensive foundational training. However, the application
    of generative AI in the field of BCIs, particularly through the development of continuous, context-rich
    neural signal generators, has been limited. To address this, we introduce the Generative EEG Transformer
    (GET), a model leveraging transformer architecture tailored for EEG data. The GET model is pre-trained
    on diverse EEG datasets, including motor imagery and alpha wave datasets, enabling it to produce high-fidelity
    neural signals that maintain contextual integrity. Our empirical findings indicate that GET not only
    faithfully reproduces the frequency spectrum of the training data and input prompts but also robustly
    generates continuous neural signals. By adopting the successful training strategies of the NLP domain
    for BCIs, the GET sets a new standard for the development and application of neural signal generation
    technologies.
  expected_priority: B-apoio
  audit_status: reclassificacao-clara
  reason: Geração de EEG; NLP aparece como analogia metodológica.
- id: v4-3f-audit-13-natural-scene-reconstruction-from-fmri-signals-using-ge
  title: Natural scene reconstruction from fMRI signals using generative latent diffusion
  abstract: In neural decoding research, one of the most intriguing topics is the reconstruction of perceived
    natural images based on fMRI signals. Previous studies have succeeded in re-creating different aspects
    of the visuals, such as low-level properties (shape, texture, layout) or high-level features (category
    of objects, descriptive semantics of scenes) but have typically failed to reconstruct these properties
    together for complex scene images. Generative AI has recently made a leap forward with latent diffusion
    models capable of generating high-complexity images. Here, we investigate how to take advantage of
    this innovative technology for brain decoding. We present a two-stage scene reconstruction framework
    called "Brain-Diffuser". In the first stage, starting from fMRI signals, we reconstruct images that
    capture low-level properties and overall layout using a VDVAE (Very Deep Variational Autoencoder)
    model. In the second stage, we use the image-to-image framework of a latent diffusion model (Versatile
    Diffusion) conditioned on predicted multimodal (text and visual) features, to generate final reconstructed
    images. On the publicly available Natural Scenes Dataset benchmark, our method outperforms previous
    models both qualitatively and quantitatively. When applied to synthetic fMRI patterns generated from
    individual ROI (region-of-interest) masks, our trained model creates compelling "ROI-optimal" scenes
    consistent with neuroscientific knowledge. Thus, the proposed methodology can have an impact on both
    applied (e.g. brain-computer interface) and fundamental neuroscience.
  expected_priority: B-apoio
  audit_status: reclassificacao-clara
  reason: Reconstrução de imagens, não linguagem.
- id: v4-3f-audit-14-neural-decoding-of-music-from-the-eeg
  title: Neural decoding of music from the EEG
  abstract: 'Neural decoding models can be used to decode neural representations of visual, acoustic,
    or semantic information. Recent studies have demonstrated neural decoders that are able to decode
    accoustic information from a variety of neural signal types including electrocortiography (ECoG) and
    the electroencephalogram (EEG). In this study we explore how functional magnetic resonance imaging
    (fMRI) can be combined with EEG to develop an accoustic decoder. Specifically, we first used a joint
    EEG-fMRI paradigm to record brain activity while participants listened to music. We then used fMRI-informed
    EEG source localisation and a bi-directional long-term short term deep learning network to first extract
    neural information from the EEG related to music listening and then to decode and reconstruct the
    individual pieces of music an individual was listening to. We further validated our decoding model
    by evaluating its performance on a separate dataset of EEG-only recordings. We were able to reconstruct
    music, via our fMRI-informed EEG source analysis approach, with a mean rank accuracy of 71.8% ([Formula:
    see text], [Formula: see text]). Using only EEG data, without participant specific fMRI-informed source
    analysis, we were able to identify the music a participant was listening to with a mean rank accuracy
    of 59.2% ([Formula: see text], [Formula: see text]). This demonstrates that our decoding model may
    use fMRI-informed source analysis to aid EEG based decoding and reconstruction of acoustic information
    from brain activity and makes a step towards building EEG-based neural decoders for other complex
    information domains such as other acoustic, visual, or semantic information.'
  expected_priority: B-apoio
  audit_status: reclassificacao-clara
  reason: Decodificação de música, não linguagem.
- id: v4-3f-audit-15-neuroassist-enhancing-cognitive-computer-synergy-with-a
  title: 'NeuroAssist: Enhancing Cognitive-Computer Synergy with Adaptive AI and Advanced Neural Decoding
    for Efficient EEG Signal Classification'
  abstract: Traditional methods of controlling prosthetics frequently encounter difficulties regarding
    flexibility and responsiveness, which can substantially impact people with varying cognitive and physical
    abilities. Advancements in computational neuroscience and machine learning (ML) have recently led
    to the development of highly advanced brain-computer interface (BCI) systems that may be customized
    to meet individual requirements. To address these issues, we propose NeuroAssist, a sophisticated
    method for analyzing EEG data that merges state-of-the-art BCI technology with adaptable artificial
    intelligence (AI) algorithms. NeuroAssist's hybrid neural network design efficiently overcomes the
    constraints of conventional EEG data processing. Our methodology combines a Natural Language Processing
    (NLP) BERT model to extract complex features from numerical EEG data and utilizes LSTM networks to
    handle temporal dynamics. In addition, we integrate spiking neural networks (SNNs) and deep Q-networks
    (DQN) to improve decision-making and flexibility. Our preprocessing method classifies motor imagery
    (MI) one-versus-the-rest using a common spatial pattern (CSP) while preserving EEG temporal characteristics.
    The hybrid architecture of NeuroAssist serves as the DQN's Q-network, enabling continuous feedback-based
    improvement and adaptability. This enables it to acquire optimal actions through trial and error.
    This experimental analysis has been conducted on the GigaScience and BCI-competition-IV-2a datasets,
    which have shown exceptional effectiveness in categorizing MI-EEG signals, obtaining an impressive
    classification accuracy of 99.17%. NeuroAssist offers a crucial approach to current assistive technology
    by potentially enhancing the speed and versatility of BCI systems.
  expected_priority: B-apoio
  audit_status: revisao-manual
  reason: BERT aplicado à classificação motora; provável B-apoio.
- id: v4-3f-audit-16-rgb-d-cameras-and-braincomputer-interfaces-for-human-ac
  title: 'RGB-D Cameras and Brain–Computer Interfaces for Human Activity Recognition: An Overview'
  abstract: This paper provides a perspective on the use of RGB-D cameras and non-invasive brain-computer
    interfaces (BCIs) for human activity recognition (HAR). Then, it explores the potential of integrating
    both the technologies for active and assisted living. RGB-D cameras can offer monitoring of users
    in their living environments, preserving their privacy in human activity recognition through depth
    images and skeleton tracking. Concurrently, non-invasive BCIs can provide access to intent and control
    of users by decoding neural signals. The synergy between these technologies may allow holistic understanding
    of both physical context and cognitive state of users, to enhance personalized assistance inside smart
    homes. The successful deployment in integrating the two technologies needs addressing critical technical
    hurdles, including computational demands for real-time multi-modal data processing, and user acceptance
    challenges related to data privacy, security, and BCI illiteracy. Continued interdisciplinary research
    is essential to realize the full potential of RGB-D cameras and BCIs as AAL solutions, in order to
    improve the quality of life for independent or impaired people.
  expected_priority: B-apoio
  audit_status: reclassificacao-clara
  reason: Privacidade e segurança aparecem como desafios de implantação.
- id: v4-3f-audit-17-visual-representations-insights-from-neural-decoding
  title: 'Visual Representations: Insights from Neural Decoding'
  abstract: Patterns of brain activity contain meaningful information about the perceived world. Recent
    decades have welcomed a new era in neural analyses, with computational techniques from machine learning
    applied to neural data to decode information represented in the brain. In this article, we review
    how decoding approaches have advanced our understanding of visual representations and discuss efforts
    to characterize both the complexity and the behavioral relevance of these representations. We outline
    the current consensus regarding the spatiotemporal structure of visual representations and review
    recent findings that suggest that visual representations are at once robust to perturbations, yet
    sensitive to different mental states. Beyond representations of the physical world, recent decoding
    work has shone a light on how the brain instantiates internally generated states, for example, during
    imagery and prediction. Going forward, decoding has remarkable potential to assess the functional
    relevance of visual representations for human behavior, reveal how representations change across development
    and during aging, and uncover their presentation in various mental disorders.
  expected_priority: B-apoio
  audit_status: reclassificacao-clara
  reason: Decodificação visual.
- id: v4-3f-collateral-414-a-novel-combination-of-natural-language-processing-and-
  title: A Novel Combination of Natural Language Processing and Brain Computer Interface in a Communication System
