- id: v4-3f-audit-01-a-proposed-sign-language-model-for-speechless-persons-u
  title: A PROPOSED SIGN LANGUAGE MODEL FOR SPEECHLESS PERSONS USING EEG SIGNALS
  abstract: Recently, algorithms of machine learning are widely used with the field of electroencephalography
    (EEG)-Brain-Computer interfaces (BCI). In this paper, a sign language software model based on the
    EEG brain signal was implemented, to help the speechless persons to communicate their thoughts to
    others.  The preprocessing stage for the EEG signals was performed by applying the Principle Component
    Analysis (PCA) algorithm to extract the important features and reducing the data redundancy. A model
    for classifying ten classes of EEG signals, including  Facial Expression(FE) and some Motor Execution(ME)
    processes, had been designed. A neural network of three hidden layers with deep learning classifier
    had been used in this work. Data set from four different subjects were collected using a 14 channels
    Emotiv epoc+ device. A classification results with accuracy 95.75% were obtained ‎for the collected
    samples. An optimization process was performed on the predicted class with the aid of user, and then
    sign class will be connected to the specified sentence under a predesigned lock up table.
  expected_priority: B-apoio
  audit_status: reclassificacao-clara
  reason: Modelo de classificação de sinais, não um language model.
- id: v4-3f-audit-02-a-human-machine-environment-interaction-system-based-on
  title: A human-machine-environment interaction system based on VLA model and brain-computer interface
  abstract: The vision language action (VLA) model has shown extraordinary ability in the motion planning
    of the robots, which has great value in human-machine-environment interaction (HMEI), especially for
    rehabilitation engineering and robotic arm teleoperation fields. This paper proposes an HMEI system
    that integrates the brain-computer interface (BCI) with VLA model, enabling robots to interact with
    surrounding environment according to human intentions. Firstly, neural decoding technique is employed
    to interpret neural signals into intentions via a time and frequency fusion model. Then, the user’s
    intentions are converted into a textual instruction, which subsequently guides the VLA model in generating
    corresponding motion trajectories for robotic arm teleoperation. Experimental results demonstrate
    smooth and compliant control of the robotic arm, which can be a viable solution for HMEI applications.
  expected_priority: B-apoio
  audit_status: revisao-manual
  reason: Integra BCI e VLA para controle robótico; decidir entre A1 e B.
- id: v4-3f-audit-03-a-study-on-the-application-of-contrastive-learning-in-t
  title: A study on the application of contrastive learning in the brain-computer interface of motor imagery
  abstract: In brain-computer interface (BCI) systems, acquiring EEG signals is relatively easy, but labeling
    EEG signals is challenging. Supervised learning is widely used in existing BCI research, but its generalization
    ability is poor due to the influence of labeled data, which is not conducive to the promotion and
    application of BCI. In the fields of computer vision and natural language processing, self-supervised
    learning is becoming a popular research direction that can use unlabeled data for learning. In this
    study, we propose a self-supervised contrastive learning method for identifying motor imagery states
    by performing different data transformation operations on EEG data to generate positive and negative
    sample pairs. This allows the pre-trained network to learn general feature representations from the
    signals, enabling it to converge faster and achieve better classification performance when performing
    downstream tasks. The network's performance is significantly related to the amount of unlabeled data
    used in the self-supervised learning process. Through the evaluation of the collected data, we achieved
    an accuracy of 82.56% in classifying motor imagery states with 40% amount of labeled data, demonstrating
    the practical value of our method.
  expected_priority: B-apoio
  audit_status: reclassificacao-clara
  reason: NLP aparece apenas como área de referência metodológica.
- id: v4-3f-audit-04-advancing-brain-computer-interface-closed-loop-systems-
  title: 'Advancing Brain-Computer Interface Closed-Loop Systems for Neurorehabilitation: Systematic Review
    of AI and Machine Learning Innovations in Biomedical Engineering'
  abstract: Abstract Background Brain-computer interface (BCI) closed-loop systems have emerged as a promising
    tool in health care and wellness monitoring, particularly in neurorehabilitation and cognitive assessment.
    With the increasing burden of neurological disorders, including Alzheimer disease and related dementias
    (AD/ADRD), there is a critical need for real-time, noninvasive monitoring technologies. BCIs enable
    direct communication between the brain and external devices, leveraging artificial intelligence (AI)
    and machine learning (ML) to interpret neural signals. However, challenges such as signal noise, data
    processing limitations, and privacy concerns hinder widespread implementation. Objective The primary
    objective of this study is to investigate the role of ML and AI in enhancing BCI closed-loop systems
    for health care applications. Specifically, we aim to analyze the methods and parameters used in these
    systems, assess the effectiveness of different AI and ML techniques, identify key challenges in their
    development and implementation, and propose a framework for using BCIs in the longitudinal monitoring
    of AD/ADRD patients. By addressing these aspects, this study seeks to provide a comprehensive overview
    of the potential and limitations of AI-driven BCIs in neurological health care. Methods A systematic
    literature review was conducted following PRISMA (Preferred Reporting Items for Systematic Reviews
    and Meta-Analyses) guidelines, focusing on studies published between 2019 and 2024. We sourced research
    articles from PubMed, IEEE, ACM, and Scopus using predefined keywords related to BCIs, AI, and AD/ADRD.
    A total of 220 papers were initially identified, with 18 meeting the final inclusion criteria. Data
    extraction followed a structured matrix approach, categorizing studies based on methods, ML algorithms,
    limitations, and proposed solutions. A comparative analysis was performed to synthesize key findings
    and trends in AI-enhanced BCI systems for neurorehabilitation and cognitive monitoring. Results The
    review identified several ML techniques, including transfer learning (TL), support vector machines
    (SVMs), and convolutional neural networks (CNNs), that enhance BCI closed-loop performance. These
    methods improve signal classification, feature extraction, and real-time adaptability, enabling accurate
    monitoring of cognitive states. However, challenges such as long calibration sessions, computational
    costs, data security risks, and variability in neural signals were also highlighted. To address these
    issues, emerging solutions such as improved sensor technology, efficient calibration protocols, and
    advanced AI-driven decoding models are being explored. In addition, BCIs show potential for real-time
    alert systems that support caregivers in managing AD/ADRD patients. Conclusions BCI closed-loop systems,
    when integrated with AI and ML, offer significant advancements in neurological health care, particularly
    in AD/ADRD monitoring and neurorehabilitation. Despite their potential, challenges related to data
    accuracy, security, and scalability must be addressed for widespread clinical adoption. Future research
    should focus on refining AI models, improving real-time data processing, and enhancing user accessibility.
    With continued advancements, AI-powered BCIs can revolutionize personalized health care by providing
    continuous, adaptive monitoring and intervention for patients with neurological disorders.
  expected_priority: B-apoio
  audit_status: reclassificacao-clara
  reason: Privacidade é desafio incidental em revisão ampla.
- id: v4-3f-audit-05-an-introductory-tutorial-on-braincomputer-interfaces-an
  title: An Introductory Tutorial on Brain–Computer Interfaces and Their Applications
  abstract: The prospect and potentiality of interfacing minds with machines has long captured human imagination.
    Recent advances in biomedical engineering, computer science, and neuroscience are making brain–computer
    interfaces a reality, paving the way to restoring and potentially augmenting human physical and mental
    capabilities. Applications of brain–computer interfaces are being explored in applications as diverse
    as security, lie detection, alertness monitoring, gaming, education, art, and human cognition augmentation.
    The present tutorial aims to survey the principal features and challenges of brain–computer interfaces
    (such as reliable acquisition of brain signals, filtering and processing of the acquired brainwaves,
    ethical and legal issues related to brain–computer interface (BCI), data privacy, and performance
    assessment) with special emphasis to biomedical engineering and automation engineering applications.
    The content of this paper is aimed at students, researchers, and practitioners to glimpse the multifaceted
    world of brain–computer interfacing.
  expected_priority: B-apoio
  audit_status: reclassificacao-clara
  reason: Tutorial amplo; ética e privacidade são tópicos secundários.
