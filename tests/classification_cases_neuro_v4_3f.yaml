- id: v4-3f-collateral-82-language-model-assisted-and-icon-based-communication-th
  title: Language-Model Assisted and Icon-Based Communication Through a Brain–Computer Interface With Different Presentation Paradigms
  abstract: Augmentative and alternative communication (AAC) is typically used by people with severe speech and physical disabilities and is one of the main application areas for the brain–computer interface (BCI) technology. The target population includes people with cerebral palsy, amyotrophic lateral sclerosis, and locked-in syndrome. Word-based AAC systems are mainly faster than letter-based counterparts and are usually supplemented by icons to aid the users. Those icon-based AAC systems that use binary signaling methods such as single click can convert into a single-input BCI system such as event-related potential (ERP) detection. Matrix speller paradigm is typically used to help users identify their target icon on the screen; however, it ties screen space to vocabulary size and navigation complexity, which may require users to make repetitive head, neck, or eye movements to visually locate their intended targets on the screen. Rapid serial visual presentation (RSVP) is an alternative
    interface that minimizes required movement by displaying all icons at a fixed location, one at a time. IconMessenger is an icon-based BCI–AAC system that combines ERP signal detection with a unified framework for different presentation paradigms including RSVP, matrix speller row&column presentation, and matrix speller single character presentation. IconMessenger also takes advantage of a unique sem-gram language model, incorporated tightly in the inference engine. In this paper, we assess the ERP shape, classification accuracy, and typing performance of different presentation paradigms on 10 healthy participants.
  expected_priority: A1-central-integracao-llm
  audit_reason: Modelo de linguagem incorporado ao sistema de comunicação BCI.
- id: v4-3f-collateral-510-noisy-neural-language-modeling-for-typing-prediction-in
  title: Noisy Neural Language Modeling for Typing Prediction in BCI Communication
  abstract: Language models have broad adoption in predictive typing tasks. When the typing history contains numerous errors, as in open-vocabulary predictive typing with brain-computer interface (BCI) systems, we observe significant performance degradation in both n-gram and recurrent neural network language models trained on clean text. In evaluations of ranking character predictions, training recurrent LMs on noisy text makes them much more robust to noisy histories, even when the error model is misspecified. We also propose an effective strategy for combining evidence from multiple ambiguous histories of BCI electroencephalogram measurements.
  expected_priority: A1-central-integracao-llm
  audit_reason: Modelos de linguagem usados para predição de digitação em BCI.
- id: v4-3f-collateral-114-sequential-best-arm-identification-with-application-to-
  title: Sequential Best-Arm Identification with Application to Brain-Computer Interface
  abstract: A brain-computer interface (BCI) is a technology that enables direct communication between the brain and an external device or computer system. It allows individuals to interact with the device using only their thoughts, and holds immense potential for a wide range of applications in medicine, rehabilitation, and human augmentation. An electroencephalogram (EEG) and event-related potential (ERP)-based speller system is a type of BCI that allows users to spell words without using a physical keyboard, but instead by recording and interpreting brain signals under different stimulus presentation paradigms. Conventional non-adaptive paradigms treat each word selection independently, leading to a lengthy learning process. To improve the sampling efficiency, we cast the problem as a sequence of best-arm identification tasks in multi-armed bandits. Leveraging pre-trained large language models (LLMs), we utilize the prior knowledge learned from previous tasks to inform and facilitate
    subsequent tasks. To do so in a coherent way, we propose a sequential top-two Thompson sampling (STTS) algorithm under the fixed-confidence setting and the fixed-budget setting. We study the theoretical property of the proposed algorithm, and demonstrate its substantial empirical improvement through both synthetic data analysis as well as a P300 BCI speller simulator example.
  expected_priority: A1-central-integracao-llm
  audit_reason: LLM pré-treinado usado operacionalmente em aplicação de P300 BCI.
- id: v4-3f-collateral-416-brain-waves-to-text-neural-translation-using-deep-learn
  title: Brain Waves-to-Text Neural Translation using Deep Learning and Natural Language Processing
  abstract: 'Abstract:


    Brain–Computer Interface (BCI) technology enables communication between the human brain and external computing devices without the use of traditional speech or physical interaction. One important application of this technology is converting brain signals into readable text, which can assist individuals who are unable to speak due to severe neurological disorders or physical disabilities.This research proposes a Brain Waves-to-Text neural translation system using deep learning and Natural Language Processing techniques. The system analyses Electroencephalography (EEG) signals captured from the brain and converts them into meaningful textual outputs. In the proposed approach, EEG signals are first preprocessed to remove noise and unwanted artifacts. A hybrid deep learning architecture combining Convolutional Neural Networks (CNN) and Long Short-Term Memory (LSTM) networks is used to extract spatial and temporal patterns from the brain signals. The CNN layers are used to learn spatial relationships
    between EEG channels, while the LSTM network captures the sequential patterns present in neural signals. Experimental analysis demonstrates that the proposed framework can successfully classify brain activity patterns and convert them into understandable text representations.


    Keywords: Brain–Computer Interface, EEG Signals, Deep Learning, CNN–LSTM, Natural Language Processing, Brain Waves to Text.'
  expected_priority: A2-central-decoding-linguagem
  audit_reason: Decodificação explícita de sinais EEG para texto.
- id: v4-3f-collateral-162-unicorn-unified-cognitive-signal-reconstruction-bridgin
  title: 'UniCoRN: Unified Cognitive Signal ReconstructioN bridging cognitive signals and human language'
  abstract: 'Decoding text stimuli from cognitive signals (e.g. fMRI) enhances our understanding of the human language system, paving the way for building versatile Brain-Computer Interface. However, existing studies largely focus on decoding individual word-level fMRI volumes from a restricted vocabulary, which is far too idealized for real-world application. In this paper, we propose fMRI2text, the first open-vocabulary task aiming to bridge fMRI time series and human language. Furthermore, to explore the potential of this new task, we present a baseline solution, UniCoRN: the Unified Cognitive Signal ReconstructioN for Brain Decoding. By reconstructing both individual time points and time series, UniCoRN establishes a robust encoder for cognitive signals (fMRI & EEG). Leveraging a pre-trained language model as decoder, UniCoRN proves its efficacy in decoding coherent text from fMRI series across various split settings. Our model achieves a 34.77% BLEU score on fMRI2text, and a 37.04%
    BLEU when generalized to EEG-to-text decoding, thereby surpassing the former baseline. Experimental results indicate the feasibility of decoding consecutive fMRI volumes, and the effectiveness of decoding different cognitive signals using a unified structure.'
  expected_priority: A1-central-integracao-llm
  audit_reason: Modelo de linguagem pré-treinado integrado como decoder de sinais cognitivos para texto.
- id: v4-3f-collateral-155-p3t-a-transformer-model-for-enhancing-character-recogni
  title: 'P3T: A Transformer Model for Enhancing Character Recognition Rates in P300 Speller Systems'
  abstract: Transformer architectures have been recently widely used for natural language processing tasks, however, their application to processing of physiological signals, such as electroencephalography (EEG), has remained limited. In this paper, we introduce P300-Transformer (P3T), a new single-trial P300 detection model, designed to optimize the information transfer rate (ITR) in P300-BCI speller systems, while maintaining a high character recognition rate. Evaluating the performance of the proposed P3T model using the publicly-available P300 dataset from BCI Competition III, demonstrates an average character recognition rate of 97.50% and an ITR of 20.52 bits/min. Compared to the state-of-the-art models, our results suggest that the proposed transformer-based P3T model can significantly enhance the character recognition rate in P300 speller systems, eliminating the need for extensive feature extraction.
  expected_priority: B-apoio
  audit_reason: Transformer aplicado a EEG, sem integração operacional com modelo de linguagem.
- id: v4-3f-collateral-172-neuronarrator-a-generalist-eeg-to-text-foundation-model
  title: 'NeuroNarrator: A Generalist EEG-to-Text Foundation Model for Clinical Interpretation via Spectro-Spatial Grounding and Temporal State-Space Reasoning'
  abstract: Electroencephalography (EEG) provides a non-invasive window into neural dynamics at high temporal resolution and plays a pivotal role in clinical neuroscience research. Despite this potential, prevailing computational approaches to EEG analysis remain largely confined to task-specific classification objectives or coarse-grained pattern recognition, offering limited support for clinically meaningful interpretation. To address these limitations, we introduce NeuroNarrator, the first generalist EEG-to-text foundation model designed to translate electrophysiological segments into precise clinical narratives. A cornerstone of this framework is the curation of NeuroCorpus-160K, the first harmonized largescale resource pairing over 160,000 EEG segments with structured, clinically grounded natural-language descriptions. Our architecture first aligns temporal EEG waveforms with spatial topographic maps via a rigorous contrastive objective, establishing spectro–spatially grounded representations.
    Building on this grounding, we condition a Large Language Model through a state-space–inspired formulation that integrates historical temporal and spectral context to support coherent clinical narrative generation. This approach establishes a principled bridge between continuous signal dynamics and discrete clinical language, enabling interpretable narrative generation that facilitates expert interpretation and supports clinical reporting workflows. Extensive evaluations across diverse benchmarks and zero-shot transfer tasks highlight NeuroNarrator’s capacity to integrate temporal, spectral, and spatial dynamics, positioning it as a foundational framework for time–frequency–aware, open-ended clinical interpretation of electrophysiological data.
  expected_priority: B-apoio
  audit_reason: Geração de narrativa clínica sobre EEG, não decodificação de linguagem do usuário.
