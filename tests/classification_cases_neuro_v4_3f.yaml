- id: v4-3f-audit-07-contextual-feature-extraction-hierarchies-converge-in-l
  title: Contextual Feature Extraction Hierarchies Converge in Large Language Models and the Brain
  abstract: Recent advancements in artificial intelligence have sparked interest in the parallels between
    large language models (LLMs) and human neural processing, particularly in language comprehension.
    Although previous research has demonstrated similarities between LLM representations and neural responses,
    the computational principles driving this convergence—especially as LLMs evolve—remain elusive. Here
    we used intracranial electroencephalography recordings from neurosurgical patients listening to speech
    to investigate the alignment between high-performance LLMs and the language-processing mechanisms
    of the brain. We examined a diverse selection of LLMs with similar parameter sizes and found that
    as their performance on benchmark tasks improves, they not only become more brain-like, reflected
    in better neural response predictions from model embeddings, but they also align more closely with
    the hierarchical feature extraction pathways of the brain, using fewer layers for the same encoding.
    Additionally, we identified commonalities in the hierarchical processing mechanisms of high-performing
    LLMs, revealing their convergence towards similar language-processing strategies. Finally, we demonstrate
    the critical role of contextual information in both LLM performance and brain alignment. These findings
    reveal converging aspects of language processing in the brain and LLMs, offering new directions for
    developing models that better align with human cognitive processing. Why brain-like feature extraction
    emerges in large language models (LLMs) remains elusive. Mischler, Li and colleagues demonstrate that
    high-performing LLMs not only predict neural responses more accurately than other LLMs but also align
    more closely with the hierarchical language processing pathway in the brain, revealing parallels between
    these models and human cognitive mechanisms.
  expected_priority: B-apoio
  audit_status: reclassificacao-clara
  reason: Comparação cérebro–LLM, sem integração operacional.
- id: v4-3f-audit-08-cross-modality-fusion-with-eeg-and-text-for-enhanced-em
  title: Cross-modality fusion with EEG and text for enhanced emotion detection in English writing
  abstract: 'Introduction: Emotion detection in written text is critical for applications in human-computer
    interaction, affective computing, and personalized content recommendation. Traditional approaches
    to emotion detection primarily leverage textual features, using natural language processing techniques
    such as sentiment analysis, which, while effective, may miss subtle nuances of emotions. These methods
    often fall short in recognizing the complex, multimodal nature of human emotions, as they ignore physiological
    cues that could provide richer emotional insights. Methods: To address these limitations, this paper
    proposes Emotion Fusion-Transformer, a cross-modality fusion model that integrates EEG signals and
    textual data to enhance emotion detection in English writing. By utilizing the Transformer architecture,
    our model effectively captures contextual relationships within the text while concurrently processing
    EEG signals to extract underlying emotional states. Specifically, the Emotion Fusion-Transformer first
    preprocesses EEG data through signal transformation and filtering, followed by feature extraction
    that complements the textual embeddings. These modalities are fused within a unified Transformer framework,
    allowing for a holistic view of both the cognitive and physiological dimensions of emotion. Results
    and discussion: Experimental results demonstrate that the proposed model significantly outperforms
    text-only and EEG-only approaches, with improvements in both accuracy and F1-score across diverse
    emotional categories. This model shows promise for enhancing affective computing applications by bridging
    the gap between physiological and textual emotion detection, enabling more nuanced and accurate emotion
    analysis in English writing.'
  expected_priority: B-apoio
  audit_status: reclassificacao-clara
  reason: Fusão multimodal para emoção, sem BMI/BCI–LLM.
- id: v4-3f-audit-09-deep-learning-approaches-for-neural-decoding-across-arc
  title: Deep learning approaches for neural decoding across architectures and recording modalities
  abstract: Decoding behavior, perception or cognitive state directly from neural signals is critical
    for brain-computer interface research and an important tool for systems neuroscience. In the last
    decade, deep learning has become the state-of-the-art method in many machine learning tasks ranging
    from speech recognition to image segmentation. The success of deep networks in other domains has led
    to a new wave of applications in neuroscience. In this article, we review deep learning approaches
    to neural decoding. We describe the architectures used for extracting useful features from neural
    recording modalities ranging from spikes to functional magnetic resonance imaging. Furthermore, we
    explore how deep learning has been leveraged to predict common outputs including movement, speech
    and vision, with a focus on how pretrained deep networks can be incorporated as priors for complex
    decoding targets like acoustic speech or images. Deep learning has been shown to be a useful tool
    for improving the accuracy and flexibility of neural decoding across a wide range of tasks, and we
    point out areas for future scientific development.
  expected_priority: B-apoio
  audit_status: reclassificacao-clara
  reason: Revisão ampla de modalidades e saídas.
- id: v4-3f-audit-10-do-large-language-models-mirror-cognitive-language-proc
  title: Do Large Language Models Mirror Cognitive Language Processing?
  abstract: Large Language Models (LLMs) have demonstrated remarkable abilities in text comprehension
    and logical reasoning, indicating that the text representations learned by LLMs can facilitate their
    language processing capabilities. In neuroscience, brain cognitive processing signals are typically
    utilized to study human language processing. Therefore, it is natural to ask how well the text embeddings
    from LLMs align with the brain cognitive processing signals, and how training strategies affect the
    LLM-brain alignment? In this paper, we employ Representational Similarity Analysis (RSA) to measure
    the alignment between 23 mainstream LLMs and fMRI signals of the brain to evaluate how effectively
    LLMs simulate cognitive language processing. We empirically investigate the impact of various factors
    (e.g., pre-training data size, model scaling, alignment training, and prompts) on such LLM-brain alignment.
    Experimental results indicate that pre-training data size and model scaling are positively correlated
    with LLM-brain similarity, and alignment training can significantly improve LLM-brain similarity.
    Explicit prompts contribute to the consistency of LLMs with brain cognitive language processing, while
    nonsensical noisy prompts may attenuate such alignment. Additionally, the performance of a wide range
    of LLM evaluations (e.g., MMLU, Chatbot Arena) is highly correlated with the LLM-brain similarity.
  expected_priority: B-apoio
  audit_status: reclassificacao-clara
  reason: Estudo de alinhamento cérebro–LLM.
