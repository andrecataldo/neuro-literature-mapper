priority_labels:
  A-central: Combina BMI/BCI ou sinais neurais com decodificação/linguagem/LLM e dimensão humana ou de risco.
  B-apoio: Contribui para uma parte importante do recorte ou para fundamentação.
  C-cautela: Fonte preliminar ou preprint relevante que exige validação adicional.
  D-descartar: Falso positivo, duplicata ou registro sem relação útil com o tema.
exclusion_reasons:
  false-positive: Coincidência terminológica sem relação com BMI/BCI.
  body-mass-index: BMI significa Body Mass Index.
  wrong-bci: BCI possui significado diferente de Brain-Computer Interface.
  out-of-scope: Estudo fora do recorte da pesquisa.
  duplicate: Registro duplicado.
  replaced-version: Versão preliminar substituída por publicação posterior.
  insufficient-metadata: Metadados insuficientes para triagem.
