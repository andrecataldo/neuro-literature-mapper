priority_labels:
  A1-central-integracao-llm: Integração explícita entre BMI/BCI ou decodificação neural e LLM/modelo de linguagem/NLP.
  A2-central-decoding-linguagem: Decodificação neural de fala, texto, linguagem ou significado, mesmo sem uso explícito de LLM.
  A3-central-riscos-governanca: Riscos, privacidade, segurança, neuroética ou governança diretamente associados a BMI/BCI.
  B-apoio: Fundamentação ou dimensão adjacente relevante, sem combinação suficiente para integrar o núcleo central.
  D-descartar: Falso positivo, comentário, registro irrelevante ou fora do escopo.
exclusion_reasons:
  body-mass-index: BMI significa Body Mass Index.
  bayesian-cue-integration: BCI significa Bayesian Cue Integration.
  neuro-linguistic-programming: NLP significa Neuro-Linguistic Programming.
  non-brain-neural: Uso de neural relacionado a redes neurais, não a dados cerebrais.
  review-comment: Registro é comentário, revisão aberta ou resposta a outro artigo.
  out-of-scope: Estudo fora do recorte.
  duplicate: Registro duplicado.
  replaced-version: Versão preliminar substituída.
