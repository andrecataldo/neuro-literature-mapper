project:
  name: BMI/BCI, LLMs, Neurotecnologia e Vieses
  description: Mapeamento exploratório de literatura sobre integração entre BMI/BCI, decodificação neural, modelos de linguagem, vieses, segurança, privacidade e governança.

includes:
  taxonomy: taxonomy_neuro.yaml
  venues: venues_neuro.yaml

settings:
  per_page: 10
  year_min: 2018
  language: en
  enforce_year_filter: true

  enabled_sources:
    - openalex
    - crossref
    - semantic_scholar

  sources:
    openalex:
      minimum_interval_seconds: 0.2
      max_retries: 2

    semantic_scholar:
      minimum_interval_seconds: 1.05
      max_retries: 3

    crossref:
      minimum_interval_seconds: 0.25
      max_retries: 3

api_layers:
- name: 01 - Integração BMI/BCI + LLMs
  queries:
  - '"brain-computer interface" "large language model"'
  - '"brain-machine interface" "large language model"'
  - '"brain-computer interface" "generative AI"'
  - '"brain-computer interface" "language model"'
  - '"brain-to-text" "large language model"'
  - '"BCI speller" "large language model"'
  - '"BCI" "large language model" brain'
  - '"BCI" "language model" EEG'
  - '"ChatBCI"'
  - '"P300 speller" "large language model"'
  - '"EEG-to-text" "language model"'
  - '"neural language decoding" "large language model"'
  - '"brain decoding" "large language model"'
- name: 02 - Decodificação neural de linguagem
  queries:
  - '"neural decoding" "language"'
  - '"neural decoding" "speech"'
  - '"brain-to-text"'
  - '"EEG-to-text"'
  - '"imagined speech" "brain-computer interface"'
  - '"speech decoding" "brain-computer interface"'
  - '"brain-computer interface" "language decoding"'
  - '"BCI" "language decoding" brain'
  - '"ECoG" "speech decoding"'
  - '"covert speech" ECoG decoding'
  - '"speech neuroprosthesis"'
  - '"neural speech prosthesis"'
  - '"imagined handwriting" brain-to-text'
- name: 03 - BMI/BCI, NLP e comunicação assistiva
  queries:
  - '"brain-computer interface" "natural language processing"'
  - '"brain-machine interface" "natural language processing"'
  - '"neural interface" "language model"'
  - '"assistive communication" "brain-computer interface"'
  - '"brain-computer interface" "text generation"'
  - '"BCI speller" "word prediction"'
  - '"P300 speller" "language model"'
  - '"brain-computer interface" "predictive text"'
- name: 04 - Vieses, confiança e vulnerabilidades em LLMs
  queries:
  - '"cognitive bias" "large language models"'
  - '"confirmation bias" "large language models"'
  - '"anchoring bias" "large language models"'
  - '"automation bias" "generative AI"'
  - '"overreliance" "large language models"'
  - '"trust" "large language models" "decision making"'
  - '"hallucination" "large language models" "safety"'
- name: 05 - BMI/BCI, privacidade e governança
  queries:
  - '"brain-computer interface" "privacy"'
  - '"brain-computer interface" "security"'
  - '"brain-computer interface" "ethics"'
  - '"brain-computer interface" "safety"'
  - '"BCI" "neural privacy" brain'
  - '"BCI" "data ownership" brain'
  - '"brain-computer interface researcher" privacy'
  - '"neurotechnology" "governance"'
  - '"neurotechnology" "privacy"'
  - '"neural privacy"'
  - '"neurorights" "artificial intelligence"'
