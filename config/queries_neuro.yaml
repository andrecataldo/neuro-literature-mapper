project:
  name: "BMI/BCI, LLMs, Neurotecnologia e Vieses"
  description: "Mapeamento exploratório estruturado sobre BMI/BCI, LLMs, neuroengenharia, neurotecnologia, vieses, segurança, privacidade e governança."

includes:
  taxonomy: taxonomy_neuro.yaml
  venues: venues_neuro.yaml

settings:
  per_page: 5
  year_min: 2018
  language: "en"
  enforce_year_filter: true
  request_delay_seconds: 1

api_layers:
  - name: "01 - BMI/BCI + LLMs"
    queries:
      - '"brain-computer interface" "large language model"'
      - '"brain-computer interface" LLM'
      - '"brain-machine interface" "large language model"'
      - '"brain-machine interface" LLM'
      - '"BCI" "large language models"'
      - '"BMI" "large language models"'

  - name: "02 - Neuroengenharia + decodificação neural"
    queries:
      - '"neural decoding" "language"'
      - '"neural decoding" "speech"'
      - '"brain-to-text"'
      - '"imagined speech" "brain-computer interface"'
      - '"speech decoding" "brain-computer interface"'
      - '"EEG" "language decoding"'
      - '"ECoG" "speech decoding"'

  - name: "03 - BMI/BCI + NLP / modelos de linguagem"
    queries:
      - '"brain-computer interface" "natural language processing"'
      - '"brain-machine interface" "natural language processing"'
      - '"BCI" "NLP"'
      - '"neural interface" "language model"'
      - '"assistive communication" "language model"'
      - '"brain-computer interface" "text generation"'

  - name: "04 - Vieses, confiança e vulnerabilidades em IA"
    queries:
      - '"cognitive bias" "large language models"'
      - '"confirmation bias" "large language models"'
      - '"anchoring bias" "large language models"'
      - '"automation bias" "generative AI"'
      - '"overreliance" "large language models"'
      - '"trust" "large language models" "decision making"'
      - '"hallucination" "large language models" "safety"'

  - name: "05 - Neurotecnologia, privacidade e governança"
    queries:
      - '"neurotechnology" "governance"'
      - '"neurotechnology" "privacy"'
      - '"neural data" "privacy"'
      - '"brain-computer interface" "privacy"'
      - '"brain-computer interface" "ethics"'
      - '"brain-computer interface" "safety"'
      - '"neurorights" "artificial intelligence"'

venue_search_layers:
  - venue_group: "Journal of Neural Engineering"
    base_site: "iopscience.iop.org/journal/1741-2552"
    queries:
      - '"brain-computer interface" "language"'
      - '"brain-machine interface" "language"'
      - '"neural decoding" "language"'
      - '"brain-to-text"'
      - '"large language model"'
      - '"LLM"'

  - venue_group: "IEEE Neural Engineering / Biomedical Engineering"
    base_site: "ieeexplore.ieee.org"
    queries:
      - '"brain-computer interface" "large language model"'
      - '"brain-machine interface" "large language model"'
      - '"neural decoding" "speech"'
      - '"imagined speech" "BCI"'
      - '"assistive communication" "BCI"'
      - '"neural interface" "language model"'

  - venue_group: "Journal of NeuroEngineering and Rehabilitation"
    base_site: "jneuroengrehab.biomedcentral.com"
    queries:
      - '"brain-computer interface"'
      - '"brain-machine interface"'
      - '"assistive communication"'
      - '"neural decoding"'
      - '"speech decoding"'
      - '"language model"'

  - venue_group: "Frontiers in Neuroscience / Human Neuroscience"
    base_site: "frontiersin.org"
    queries:
      - '"brain-computer interface" "language"'
      - '"neural decoding" "language"'
      - '"imagined speech"'
      - '"neurotechnology" "ethics"'
      - '"neural data" "privacy"'

  - venue_group: "NeuroImage / ScienceDirect"
    base_site: "sciencedirect.com"
    queries:
      - '"neural decoding" "language"'
      - '"speech decoding" "brain"'
      - '"brain-computer interface" "language"'
      - '"EEG" "language decoding"'
      - '"ECoG" "speech decoding"'

  - venue_group: "Nature portfolio"
    base_site: "nature.com"
    queries:
      - '"brain-computer interface" "speech"'
      - '"brain-machine interface" "neural decoding"'
      - '"brain-to-text"'
      - '"neurotechnology" "privacy"'
      - '"neurotechnology" "ethics"'

  - venue_group: "ACL Anthology"
    base_site: "aclanthology.org"
    queries:
      - '"large language models" "cognitive bias"'
      - '"large language models" "decision making"'
      - '"overreliance" "large language models"'
      - '"human-AI interaction" "large language models"'
      - '"language model" "neural decoding"'

  - venue_group: "ACM HCI / FAccT / AIES"
    base_site: "dl.acm.org"
    queries:
      - '"human-AI interaction" "large language models"'
      - '"overreliance" "AI"'
      - '"trust" "AI" "decision making"'
      - '"cognitive bias" "AI"'
      - '"neurotechnology" "privacy"'
      - '"brain-computer interface" "ethics"'

  - venue_group: "AI / ML conferences"
    base_site: ""
    queries:
      - '"large language models" "cognitive bias" "NeurIPS"'
      - '"large language models" "human-AI interaction" "ICLR"'
      - '"large language models" "decision making" "ICML"'
      - '"neural decoding" "language model" "NeurIPS"'
      - '"brain-computer interface" "large language model" "NeurIPS"'

